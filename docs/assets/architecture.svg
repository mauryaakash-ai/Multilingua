<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Multilingua architecture</title><desc id="desc">English video flows through normalization, Whisper, IndicTrans2, human review, Hindi speech, duration fitting, optional MuseTalk or LatentSync and versioned export. A Python controller manages files and isolated subprocess adapters.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#337e70"/></marker></defs>
<rect width="1200" height="740" rx="20" fill="#f5f7fa"/>
<rect x="28" y="28" width="1144" height="125" rx="16" fill="#102b3b"/>
<g font-family="Arial, sans-serif"><text x="56" y="66" font-size="13" letter-spacing="2" fill="#87e4ca">MULTILINGUA / SYSTEM DESIGN</text>
<text x="56" y="108" font-size="29" font-weight="700" fill="white">A human checkpoint. A traceable delivery.</text>
<text x="56" y="133" font-size="14" fill="#c9dce4">English → Hindi · Recorded video · Local processing · Separate model environments</text>
<rect x="40" y="195" width="252" height="98" rx="12" fill="white" stroke="#cddce1"/>
<text x="56" y="220" font-size="11" fill="#28735e" font-weight="700">01 / INPUT</text>
<text x="56" y="246" font-size="19" font-weight="700" fill="#102b3b">English video</text>
<text x="56" y="271" font-size="13" fill="#526b7a">Permitted single-speaker clip</text>
<rect x="328" y="195" width="252" height="98" rx="12" fill="white" stroke="#cddce1"/>
<text x="344" y="220" font-size="11" fill="#28735e" font-weight="700">02 / RECOGNIZE</text>
<text x="344" y="246" font-size="19" font-weight="700" fill="#102b3b">FFmpeg + Whisper</text>
<text x="344" y="271" font-size="13" fill="#526b7a">Normalize media; timestamp speech</text>
<rect x="616" y="195" width="252" height="98" rx="12" fill="white" stroke="#cddce1"/>
<text x="632" y="220" font-size="11" fill="#28735e" font-weight="700">03 / TRANSLATE</text>
<text x="632" y="246" font-size="19" font-weight="700" fill="#102b3b">IndicTrans2</text>
<text x="632" y="271" font-size="13" fill="#526b7a">Generate Hindi phrases</text>
<rect x="904" y="195" width="252" height="98" rx="12" fill="#e4f5ef" stroke="#cddce1"/>
<text x="920" y="220" font-size="11" fill="#28735e" font-weight="700">04 / APPROVE</text>
<text x="920" y="246" font-size="19" font-weight="700" fill="#102b3b">Human review</text>
<text x="920" y="271" font-size="13" fill="#526b7a">Correct meaning, names and numbers</text>
<path d="M292 244H322" fill="none" stroke="#337e70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 244H610" fill="none" stroke="#337e70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M868 244H898" fill="none" stroke="#337e70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1030 293V350" fill="none" stroke="#337e70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="904" y="355" width="252" height="98" rx="12" fill="white" stroke="#cddce1"/>
<text x="920" y="380" font-size="11" fill="#28735e" font-weight="700">05 / SYNTHESIZE</text>
<text x="920" y="406" font-size="19" font-weight="700" fill="#102b3b">Hindi speech</text>
<text x="920" y="431" font-size="13" fill="#526b7a">Parler-TTS or permitted IndicF5 voice</text>
<rect x="616" y="355" width="252" height="98" rx="12" fill="white" stroke="#cddce1"/>
<text x="632" y="380" font-size="11" fill="#28735e" font-weight="700">06 / ALIGN</text>
<text x="632" y="406" font-size="19" font-weight="700" fill="#102b3b">Duration fitting</text>
<text x="632" y="431" font-size="13" fill="#526b7a">Pad / ≤1.25× speed / reject overflow</text>
<rect x="328" y="355" width="252" height="98" rx="12" fill="white" stroke="#cddce1"/>
<text x="344" y="380" font-size="11" fill="#28735e" font-weight="700">07 / SYNCHRONIZE</text>
<text x="344" y="406" font-size="19" font-weight="700" fill="#102b3b">MuseTalk / LatentSync</text>
<text x="344" y="431" font-size="13" fill="#526b7a">Optional mouth-region editing</text>
<rect x="40" y="355" width="252" height="98" rx="12" fill="#e4f5ef" stroke="#cddce1"/>
<text x="56" y="380" font-size="11" fill="#28735e" font-weight="700">08 / EXPORT</text>
<text x="56" y="406" font-size="19" font-weight="700" fill="#102b3b">Versioned delivery</text>
<text x="56" y="431" font-size="13" fill="#526b7a">MP4 + SRT + text + timing + ZIP</text>
<path d="M904 404H874" fill="none" stroke="#337e70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M616 404H586" fill="none" stroke="#337e70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M328 404H298" fill="none" stroke="#337e70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M742 453V489H166V453" fill="none" stroke="#6b8090" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="395" y="481" font-size="13" fill="#526b7a">Explicit audio-only comparison</text>
<rect x="40" y="533" width="1116" height="158" rx="14" fill="#e9eff3"/>
<text x="62" y="564" font-size="18" font-weight="700" fill="#102b3b">Python controller · Gradio UI or CLI</text>
<text x="62" y="594" font-size="15" fill="#314e60">Validated JSON contracts • Per-stage timeouts • Job locks • Serialized UI work</text>
<text x="62" y="620" font-size="15" fill="#314e60">Local files and logs • Output hashes • Immutable render folders • Atomic publication pointer</text>
<text x="62" y="663" font-size="13" fill="#526b7a">No database, RAG or agent framework. Models reload per phrase: this is an offline baseline, not live streaming.</text>
</g></svg>