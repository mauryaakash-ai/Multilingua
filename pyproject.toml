[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "multilingua-lipsync"
version = "0.2.0"
description = "Reviewable English-to-Hindi video dubbing research pipeline"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
ui = ["gradio==6.32.0"]
dev = ["ruff==0.17.5", "build>=1.2,<2", "playwright>=1.50,<2"]
server = ["fastapi>=0.141.1,<1", "uvicorn>=0.52.4,<1"]
[project.scripts]
multilingua = "multilingua.cli:main"
[tool.setuptools.packages.find]
include = ["multilingua*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"adapters/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/browser_smoke.py" = ["E402"]
"multilingua/resident_worker.py" = ["E402"]
"benchmarks/*.py" = ["E402"]

[tool.setuptools.package-data]
multilingua = ["languages.json"]
